    abstract-less: This study focuses on Russian-to-Chinese machine translation (MT) for scientific paper titles, tackling context lack and scarce parallel corpora.
    abstract-more: It uses LLMs to generate context-rich abstracts (Rouge-1 ~90), builds a pivot-based MT model (Bleu4 +3.14) and a context-integrated model (Bleu4 +1.22). Results show context and English pivot boost MT quality. The study has 23 figs, 14 tables, 81 refs (65 English).
    tag: 
