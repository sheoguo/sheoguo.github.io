# about me
first-paragraph: Hello! My name is Shuao Guo (<highlight>郭姝澳</highlight>), you can call me sheo (/ʃiː.oʊ/). I am an AI enthusiast and researcher. In 2024, I completed my Master's degree in Competitive Intelligence from <a href="https://www.istic.ac.cn/html/1/529/558/index.html" target="_blank" rel="noopener">Institute of Scientific and Technical Information of China(ISTIC) </a>, where I spent very meaningful time in Natural Language Processing and Artificial Intelligence Lab under <a href="https://aclanthology.org/people/yanqing-he/" target="_blank" rel="noopener">Researcher Yanqing He</a>. Before that, I got my bachelor's degree in Automation from <a href="https://www.haut.edu.cn/International.htm" target="_blank" rel="noopener">Henan University of Technology(HAUT) </a>, where I received a comprehensive engineering education.(◕▿◕)
second-paragraph: I grew up in <a href="https://en.wikipedia.org/wiki/Henan" target="_blank" rel="noopener">Henan Province, China</a> (中国河南省), and spent a wonderful childhood in the countryside surrounded by fields and nature. I’m a passionate football fan ⚽ — during my gap year, I devoted myself to founding a fan club for Henan Football Club. I’m also a big supporter of Barça FC ❤️💙! Besides football, I enjoy playing the guitar in my spare time.
research-introduction: During my master period, my research mainly focused on <code>neural machine translation</code> and <code> multilingual information system </code>, which allowed me to accumulate abundant experience in natural language processing and deep learning. When I was in the undergraduate, I participated some research projects about robot manipulator and I am very interested in robotics. My future research is very open, with a particular focus on integrating natural language processing (NLP) with robotics, exploring how robots can understand and execute language-based commands, and how human-robot interactions can be enhanced through language understanding.

research-interests:

  - field: Natural Language Processing
    subfields: Vision-Language Model，Machine Translation, Information system
  
  - field: Human-Robot Interaction
    subfields: Vision-Language-Action Model, Context-aware HRI, Social robots
